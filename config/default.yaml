# voice-agent default config. Values ${LIKE_THIS} come from the environment (empty if unset).
# A profile (VOICE_PROFILE=mahadeva) overlays this file; VOICE_CONFIG=/path.yaml overlays again.
service:
  host: 0.0.0.0
  port: 8090
  data_dir: ${VOICE_DATA_DIR:-/data}        # usage.json (monthly spend per provider)
  tokens: ["${VOICE_TOKEN}"]                # page/widget/API token(s); empty list = open (never on a public host)
  language: en-GB
  max_utterance_seconds: 60
  allowed_origins: "${VOICE_ALLOWED_ORIGINS:-}"   # sites that embed voice.js, e.g. "https://radread.co.uk,https://sitewright.uk"; own host always allowed

fallback:                                   # when the browser loses the reply, send it as a Telegram voice note
  telegram_bot_token: "${VOICE_TELEGRAM_BOT_TOKEN:-}"   # the same bot the Hermes gateway uses; empty = no fallback
  telegram_chat_id: "${VOICE_TELEGRAM_CHAT_ID:-}"       # the person's Telegram user id

brain:
  url: ${BRAIN_URL}                         # any OpenAI-compatible /v1 base, e.g. http://jarvis-hermes-bridge:8077/v1
  api_key: ${BRAIN_API_KEY}
  model: ${BRAIN_MODEL:-mahadeva}
  timeout_seconds: 180
  system_prompt: ""                         # sent as a system message when non-empty (the Hermes bridge ignores it)
  first_turn_prefix: "You are being spoken to through a voice interface. Answer in short spoken sentences, no markdown, no lists; summarise instead of quoting files."
  send_history: false                       # the bridge keeps history itself (prompt_cache_key); set true for stateless brains
  min_sentence_chars: 24
  send_still: true                          # camera turns: the release still goes to the brain as an image part too (stage 10)

camera:                                     # stage 10, Mahadeva's eyes: hold-to-talk records the camera as well
  enabled: true                             # false = the page hides the camera switch and the service ignores media
  clip_max_seconds: 8                       # the last N seconds of the hold are kept (Rock: ~5 s clips, cap ~8)
  clip_wait_seconds: 12                     # after the words arrive, how long to wait for the clip before answering from the still
  clip_max_width: 960                       # clip is re-encoded this wide at 4 fps (vision models sample ~1 fps)
  still_max_bytes: 6000000
  clip_max_bytes: 40000000

waterfall:
  timeout_seconds: 8                        # per paid provider call (decision 4a)
  vision_timeout_seconds: 60                # a clip read is slower than speech; accuracy over speed (stage 10)
  local_timeout_seconds: 60                 # the CPU floor is slow but free
  cooldown_minutes: 15
  default_monthly_budget_usd: 10

providers:
  openai:
    api_key: ${OPENAI_API_KEY}
    stt_model: gpt-4o-mini-transcribe
    tts_model: gpt-4o-mini-tts
    voice: coral
    tts_instructions: "Speak clearly and briskly, British English."
    vision_model: ${OPENAI_VISION_MODEL:-gpt-4o-mini}   # stills-only fallback for the camera leg
    budget_usd: 10
  azure:
    key: ${AZURE_SPEECH_KEY}
    region: ${AZURE_SPEECH_REGION:-swedencentral}
    voice: en-GB-RyanNeural
    output_format: audio-24khz-48kbitrate-mono-mp3
    budget_usd: 10
  google:                                   # Google Cloud Speech (STT v1 + TTS v1); needs the two APIs enabled
    api_key: ${GOOGLE_SPEECH_API_KEY}        # an API key restricted to the two Speech APIs, OR
    credentials_b64: ${GOOGLE_SPEECH_CREDENTIALS_B64}   # a service-account JSON key, base64 one line
    stt_model: ${GOOGLE_STT_MODEL:-latest_short}
    data_logging: false                     # true = $0.016/min instead of $0.024 but Google may keep audio
    voice: ${GOOGLE_TTS_VOICE:-en-GB-Neural2-B}   # Standard-* $4/M chars, Neural2 $16/M, Chirp3-HD $30/M
    output_format: MP3
    budget_usd: 10
  gemini:
    api_key: ${GEMINI_API_KEY}
    stt_model: ${GEMINI_STT_MODEL:-gemini-3.8-flash}
    tts_model: ${GEMINI_TTS_MODEL:-gemini-2.5-flash-preview-tts}
    vision_model: ${GEMINI_VISION_MODEL:-gemini-3.8-flash}   # reads the clip natively; first choice for the camera leg
    voice: Kore
    budget_usd: 10
  local:
    enabled: true
    models_dir: ${VOICE_MODELS_DIR:-/models}
    whisper_model: small
    compute_type: int8
    threads: 4
    piper_voice: en_GB-alan-medium

legs:                                       # order = waterfall order; local last = the free floor
  stt: [openai, azure, google, gemini, local]
  tts: [openai, azure, google, gemini, local]
  vision: [gemini, openai]                  # camera leg: Gemini sees the clip; OpenAI gets stills only (no free floor)
